name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests with coverage
        run: |
          pip install pytest-cov
          pytest -q --cov=src --cov-report=term-missing --cov-report=xml
      - name: Coverage badge (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Validate data + demo
        run: |
          python scripts/check_data.py
          python scripts/validate.py
          python -m src.main
      - name: Regenerate visuals
        run: python scripts/generate_visuals.py
      - name: Upload visuals
        uses: actions/upload-artifact@v4
        with:
          name: visuals
          path: docs/images/*.png
